name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.3

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -v

      - name: Build Docker images
        run: |
          docker build -t devops-backend:ci ./backend
          docker build -t devops-frontend:ci ./frontend

  deploy:
    name: Deploy to Docker Swarm
    needs: test
    runs-on: self-hosted
    env:
      STACK: devops-app
    defaults:
      run:
        working-directory: /opt/devops-fullstack-app
    steps:
      - name: Update code to the pushed commit
        run: |
          git fetch origin main
          git reset --hard "$GITHUB_SHA"
          git log --oneline -1

      - name: Build images
        run: |
          APP_VERSION="${GITHUB_SHA::7}"
          docker build -t "devops-backend:$APP_VERSION" ./backend
          docker build -t "devops-frontend:$APP_VERSION" ./frontend

      - name: Deploy stack with rolling update
        run: |
          export APP_VERSION="${GITHUB_SHA::7}"
          docker stack deploy --compose-file stack.yml --resolve-image never --detach=false "$STACK"
          docker stack services "$STACK"

      - name: Smoke test the live application
        run: |
          expected="${GITHUB_SHA::7}"

          all_tasks_on_new_version() {
            for svc in "${STACK}_backend" "${STACK}_frontend"; do
              if docker service ps "$svc" --filter desired-state=running --format '{{.Image}}' | grep -vq ":$expected$"; then
                return 1
              fi
            done
            return 0
          }

          for attempt in $(seq 1 20); do
            response=$(curl -sS http://devops.local/api/health || true)
            echo "Attempt $attempt: $response"
            if all_tasks_on_new_version \
              && echo "$response" | grep -q "\"version\":\"$expected\"" \
              && echo "$response" | grep -q '"postgres":"ok"' \
              && echo "$response" | grep -q '"redis":"ok"'; then
              echo "All replicas run $expected and the app is healthy"
              exit 0
            fi
            sleep 3
          done

          echo "Smoke test failed for version $expected"
          docker stack ps "$STACK" --no-trunc | head -n 20
          docker service logs --tail 30 "${STACK}_backend"
          exit 1

      - name: Remove dangling images
        if: always()
        run: docker image prune -f