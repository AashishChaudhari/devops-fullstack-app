name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest==8.3.3

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest -v

      - name: Build Docker images
        run: |
          docker build -t devops-backend:ci ./backend
          docker build -t devops-frontend:ci ./frontend

  deploy:
    name: Deploy to server
    needs: test
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /opt/devops-fullstack-app
    steps:
      - name: Update code to the pushed commit
        run: |
          git fetch origin main
          git reset --hard "$GITHUB_SHA"
          git log --oneline -1

      - name: Build and start containers
        run: |
          export APP_VERSION="${GITHUB_SHA::7}"
          echo "Deploying version $APP_VERSION"
          docker compose up -d --build --remove-orphans

      - name: Smoke test the live application
        run: |
          expected="${GITHUB_SHA::7}"
          for attempt in $(seq 1 10); do
            response=$(curl -sS http://devops.local/api/health || true)
            echo "Attempt $attempt: $response"
            if echo "$response" | grep -q "\"version\":\"$expected\"" \
              && echo "$response" | grep -q '"postgres":"ok"' \
              && echo "$response" | grep -q '"redis":"ok"'; then
              echo "Version $expected is live and healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Smoke test failed: version $expected is not live and healthy"
          docker compose ps
          docker compose logs --tail 30 backend
          exit 1

      - name: Remove dangling images
        if: always()
        run: docker image prune -f