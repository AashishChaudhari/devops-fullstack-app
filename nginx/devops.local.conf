# Copy of /etc/nginx/sites-available/devops.local on the server.
# Install: sudo cp nginx/devops.local.conf /etc/nginx/sites-available/devops.local
#          sudo nginx -t && sudo systemctl reload nginx

# Internal services Nginx forwards to
upstream frontend {
    server 127.0.0.1:8080;
}

upstream backend {
    server 127.0.0.1:5000;
}

# Catch-all: requests for any other hostname (or the bare IP) are dropped
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# The application
server {
    listen 80;
    server_name devops.local;

    server_tokens off;

    access_log /var/log/nginx/devops.access.log;
    error_log  /var/log/nginx/devops.error.log;

    # API requests go to the Flask backend
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Everything else goes to the frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}