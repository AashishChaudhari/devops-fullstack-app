# Docker Swarm stack. The CI/CD pipeline deploys it with:
#   APP_VERSION=<commit> docker stack deploy -c stack.yml --resolve-image never devops-app

services:
  frontend:
    image: devops-frontend:${APP_VERSION:?APP_VERSION must be set}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 32M
    networks:
      - app-net

  backend:
    image: devops-backend:${APP_VERSION:?APP_VERSION must be set}
    environment:
      APP_VERSION: ${APP_VERSION}
      DB_HOST: 172.19.0.1
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - db_password
      - redis_password
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 20s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 160M
    networks:
      - app-net

  redis:
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --requirepass "$$(cat /run/secrets/redis_password)" --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 96M
    networks:
      - app-net

networks:
  app-net:
    driver: overlay

volumes:
  redis-data:

secrets:
  db_password:
    external: true
  redis_password:
    external: true